<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kennedyish Weather Card Preview</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 40px 16px 64px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #3b3b3b;
      }
      section { max-width: 1040px; margin: 0 auto 40px; padding: 32px; border-radius: 20px; }
      section.light { background: #eef0ec; }
      h2 { margin: 0 0 18px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 40px 28px; align-items: start; }
      .narrow { display: flex; flex-wrap: wrap; gap: 40px 28px; margin-top: 40px; align-items: start; }
      figure { display: flex; flex-direction: column; gap: 10px; margin: 0; min-width: 0; }
      figcaption { font-size: 12px; font-weight: 500; opacity: .65; }
    </style>
  </head>
  <body>
    <section class="light"><h2>Conditions</h2><div class="grid" data-set="scenes"></div><div class="narrow"></div></section>
    <section class="light"><h2>Options</h2><div class="grid" data-set="options"></div></section>

    <script type="module">
      import "../kennedyish-weather-card.js";

      const TZ = "America/Los_Angeles";
      // A wall-clock time in San Francisco on 2026-09-22, shifted by whole days.
      const at = (hour, minute = 0, dayOffset = 0) => {
        const date = new Date("2026-09-22T12:00:00Z");
        date.setUTCDate(date.getUTCDate() + dayOffset);
        const offset = new Date(date.toLocaleString("en-US", { timeZone: TZ })) - new Date(date.toLocaleString("en-US", { timeZone: "UTC" }));
        date.setUTCHours(hour, minute, 0, 0);
        return new Date(date.valueOf() - offset);
      };

      const WEEK = [
        ["sunny", 58, 81, 0], ["partlycloudy", 57, 76, 10], ["cloudy", 55, 70, 20],
        ["rainy", 52, 64, 70], ["lightning-rainy", 50, 61, 80], ["partlycloudy", 53, 72, 20],
        ["sunny", 56, 79, 0], ["windy", 55, 74, 0],
      ];
      const dailyForecast = (week, now) =>
        week.map(([condition, templow, temperature, chance], day) => ({
          datetime: at(12, 0, day + Math.floor((now - at(0)) / 86_400_000)).toISOString(),
          condition, templow, temperature, precipitation_probability: chance,
        }));
      const hourlyForecast = (now) =>
        Array.from({ length: 12 }, (_, hour) => ({
          datetime: new Date(Math.floor(now / 3_600_000) * 3_600_000 + hour * 3_600_000).toISOString(),
          condition: hour < 3 ? "rainy" : hour < 6 ? "cloudy" : "partlycloudy",
          temperature: 61 + Math.round(6 * Math.sin(hour / 3)),
          precipitation_probability: Math.max(0, 70 - hour * 12),
        }));

      function makeHass({ condition, temp, sun, humidity = 62, week = WEEK, now, unit = "°F", extra = {} }) {
        return {
          states: {
            "weather.forecast_home": {
              entity_id: "weather.forecast_home",
              state: condition,
              attributes: { temperature: temp, temperature_unit: unit, humidity, supported_features: 3, friendly_name: "Forecast Home" },
            },
            "sun.sun": { state: sun[0], attributes: { elevation: sun[1], rising: sun[2] } },
            "sensor.feels_like": { state: String(temp - 2), attributes: { unit_of_measurement: unit } },
            "sensor.aqi": { state: "38", attributes: {} },
            ...extra,
          },
          config: { time_zone: TZ, unit_system: { temperature: unit }, latitude: 37.7749, longitude: -122.4194 },
          locale: { language: "en", time_format: "12" },
          connection: {
            subscribeMessage: async (callback, message) => {
              setTimeout(() => callback({ type: message.forecast_type, forecast: message.forecast_type === "hourly" ? hourlyForecast(now) : dailyForecast(week, now) }));
              return () => {};
            },
          },
        };
      }

      const DAY = ["above_horizon", 42, false];
      const NIGHT = ["below_horizon", -30, false];
      const scenes = [
        ["Sunny · 1:05 PM", { condition: "sunny", temp: 78, sun: DAY, now: at(13, 5) }],
        ["Partly cloudy · 9:40 AM", { condition: "partlycloudy", temp: 64, sun: ["above_horizon", 24, true], now: at(9, 40) }],
        ["Golden hour · 6:50 PM", { condition: "sunny", temp: 70, sun: ["above_horizon", 3, false], now: at(18, 50) }],
        ["Clear night · 10:30 PM", { condition: "clear-night", temp: 58, sun: NIGHT, now: at(22, 30) }],
        ["Cloudy · 11:15 AM", { condition: "cloudy", temp: 63, sun: DAY, now: at(11, 15) }],
        ["Rainy · 3:20 PM", { condition: "rainy", temp: 57, sun: DAY, now: at(15, 20), week: [["rainy", 52, 60, 90], ...WEEK.slice(3)] }],
        ["Thunderstorms · 4:45 PM", { condition: "lightning-rainy", temp: 61, sun: DAY, now: at(16, 45) }],
        ["Snowy · 10:10 AM", { condition: "snowy", temp: 29, sun: ["above_horizon", 14, true], now: at(10, 10), week: [["snowy", 22, 31, 80], ["snowy-rainy", 26, 35, 60], ["cloudy", 18, 30, 10], ["sunny", 12, 27, 0], ["partlycloudy", 16, 33, 0]] }],
        ["Fog · 7:30 AM", { condition: "fog", temp: 55, sun: ["above_horizon", 6, true], now: at(7, 30) }],
        ["Partly cloudy night · 1:10 AM", { condition: "partlycloudy", temp: 54, sun: NIGHT, now: at(1, 10) }],
        ["Windy · 2:00 PM", { condition: "windy-variant", temp: 68, sun: DAY, now: at(14, 0) }],
        ["Pouring night · 11:40 PM", { condition: "pouring", temp: 53, sun: NIGHT, now: at(23, 40) }],
      ];
      const options = [
        ["Feels-like, humidity & AQI sensors", { condition: "sunny", temp: 78, sun: DAY, now: at(13, 5) }, { apparent_sensor: "sensor.feels_like", aqi_sensor: "sensor.aqi", show_humidity: true }],
        ["Hourly forecast, 6 rows", { condition: "rainy", temp: 61, sun: DAY, now: at(15, 20) }, { hourly_forecast: true, forecast_rows: 6 }],
        ["Title, hide_clock, 24-hour", { condition: "partlycloudy", temp: 18, unit: "°C", sun: DAY, now: at(10, 5), week: WEEK.map(([c, lo, hi, p]) => [c, Math.round((lo - 32) / 1.8), Math.round((hi - 32) / 1.8), p]) }, { title: "San Francisco", hide_clock: true, time_format: 24 }],
        ["hide_forecast_section", { condition: "sunny", temp: 78, sun: DAY, now: at(13, 5) }, { hide_forecast_section: true }],
        ["hide_today_section", { condition: "sunny", temp: 78, sun: DAY, now: at(13, 5) }, { hide_today_section: true }],
        ["Missing entity", { condition: "sunny", temp: 78, sun: DAY, now: at(13, 5) }, { entity: "weather.nope" }],
      ];

      function makeCard(scene, extraConfig = {}, width) {
        const figure = document.createElement("figure");
        if (width) figure.style.width = `${width}px`;
        const card = document.createElement("kennedyish-weather-card");
        card._now = () => scene.now;
        card.setConfig({ entity: "weather.forecast_home", ...extraConfig });
        card.hass = makeHass(scene);
        figure.append(card);
        return figure;
      }

      for (const container of document.querySelectorAll(".grid")) {
        const set = container.dataset.set === "options" ? options : scenes;
        for (const [label, scene, config] of set) {
          const figure = makeCard(scene, config);
          figure.insertAdjacentHTML("beforeend", `<figcaption>${label}</figcaption>`);
          container.append(figure);
        }
      }
      for (const container of document.querySelectorAll(".narrow")) {
        for (const width of [400, 320]) {
          const figure = makeCard(scenes[1][1], {}, width);
          figure.insertAdjacentHTML("beforeend", `<figcaption>${width}px wide</figcaption>`);
          container.append(figure);
        }
      }
    </script>
  </body>
</html>
